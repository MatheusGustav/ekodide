[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ekodide"
version = "0.2.0"
description = "Enviar e receber arquivos pela rede, lacrados (HMAC), cifrados (AES-256-GCM) e byte-idênticos — com tomada MCP pra agentes de IA."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Matheus Gustav" }]
license = { text = "MIT" }
keywords = ["file-transfer", "hmac", "aes-gcm", "encryption", "lan", "wifi", "p2p"]
# Quase tudo é stdlib (urllib, http.server, hmac). A única dependência é a
# `cryptography`: AES-256-GCM pra cifrar o conteúdo (cofre.py) — AES não existe na
# stdlib, e esconder o conteúdo na rede vale a dependência.
dependencies = ["cryptography>=42"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: File Sharing",
    "Topic :: System :: Networking",
    "Topic :: Security :: Cryptography",
    "Natural Language :: Portuguese (Brazilian)",
]

# A TOMADA MCP (ligar o Ekodide num agente de IA) é extra OPCIONAL: quem só quer
# mandar arquivo não carrega o SDK do MCP junto, e o `ekodide mcp` recusa com a
# receita de instalar em vez de estourar.
# O QR do pareamento idem: `qrcode` é pura, gratuita e desenha em ASCII sem pillow —
# sem o extra, `ekodide pair` mostra só o código escrito e a receita.
[project.optional-dependencies]
agente = ["mcp>=2"]
qr = ["qrcode>=8"]  # a 8.x é dependência ZERO (a 7.x ainda puxava pypng)

[project.urls]
Homepage = "https://github.com/MatheusGustav/ekodide"
Repository = "https://github.com/MatheusGustav/ekodide"
Issues = "https://github.com/MatheusGustav/ekodide/issues"

[project.scripts]
# Isto é o que põe o comando 'ekodide' no PATH ao instalar (pipx/pip).
ekodide = "ekodide.cli:main"

[tool.setuptools]
packages = ["ekodide"]
